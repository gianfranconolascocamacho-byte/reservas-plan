services:
  app:
    build: .
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reservas
      MYSQL_USER: reservas
      MYSQL_PASSWORD: reservas
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: